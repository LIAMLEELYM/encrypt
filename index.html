<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>TextCrypt · CRYPT//LOCAL · AES-256-GCM</title>
<style>
:root{--bg:#04070d;--panel:rgba(10,18,32,.78);--line:rgba(0,229,255,.28);--text:#d6f6ff;--mute:#6b8fa3;--a:#00e5ff;--b:#a855f7;--ok:#39ff88;--bad:#ff3b6b;--warn:#ffb020}
:root.green{--line:rgba(57,255,136,.3);--a:#39ff88;--b:#00e5ff;--text:#d8ffe8;--mute:#6ba385}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);padding:28px 16px 40px;background:var(--bg);
 font-family:ui-monospace,"SF Mono","JetBrains Mono",Consolas,"PingFang TC","Microsoft JhengHei",monospace;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
 background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;
 opacity:.18;animation:grid 14s linear infinite;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(600px 300px at 15% 0%,rgba(168,85,247,.22),transparent),radial-gradient(600px 300px at 90% 10%,rgba(0,229,255,.18),transparent),
 repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
@keyframes grid{to{background-position:0 48px,48px 0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:1.35rem;letter-spacing:.14em;color:var(--a);text-shadow:0 0 12px var(--a)}
h1 small{display:block;font-size:.7rem;letter-spacing:.2em;color:var(--mute);text-shadow:none;margin-top:4px}
.tools button{background:transparent;color:var(--a);border:1px solid var(--line);padding:6px 12px;margin-left:6px;cursor:pointer;font:inherit;font-size:.8rem;letter-spacing:.08em;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.tools button:hover{background:rgba(0,229,255,.12);box-shadow:0 0 12px var(--line)}
.card{position:relative;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);padding:24px;
 box-shadow:0 0 40px rgba(0,229,255,.08),inset 0 0 40px rgba(0,229,255,.03)}
.card::before,.card::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--a);filter:drop-shadow(0 0 6px var(--a))}
.card::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.card::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.status{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ok);margin-bottom:6px;letter-spacing:.06em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.6s infinite}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.chips span{font-size:.7rem;color:var(--a);border:1px solid var(--line);padding:2px 8px;letter-spacing:.05em}
label{display:block;font-size:.75rem;color:var(--mute);margin:18px 0 6px;letter-spacing:.14em;text-transform:uppercase}
label::before{content:"> ";color:var(--a)}
input,textarea{width:100%;background:rgba(0,0,0,.45);color:var(--text);border:1px solid var(--line);padding:12px;font:inherit;font-size:.92rem;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 0 18px rgba(0,229,255,.25)}
textarea{height:130px;resize:vertical}
.row{display:flex;gap:8px}
.mini{background:transparent;color:var(--a);border:1px solid var(--line);padding:0 14px;cursor:pointer;font:inherit;font-size:.8rem;white-space:nowrap}
.mini:hover{background:rgba(0,229,255,.1)}
.bar{display:flex;gap:4px;margin-top:10px}
.bar i{flex:1;height:5px;background:rgba(255,255,255,.08);transition:.25s}
.hint{font-size:.75rem;color:var(--mute);margin-top:6px;min-height:1.1em}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;border:0;padding:12px 26px;font:inherit;font-weight:700;letter-spacing:.14em;cursor:pointer;color:#001018;
 background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 18px rgba(0,229,255,.35);
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover{filter:brightness(1.15)}
.btn.alt{background:transparent;color:var(--a);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:scan .8s infinite}
#msg,#fmsg{min-height:1.4em;margin-top:14px;font-size:.85rem;letter-spacing:.04em;overflow-wrap:anywhere}
.err{color:var(--bad);text-shadow:0 0 8px var(--bad)}.good{color:var(--ok);text-shadow:0 0 8px var(--ok)}
footer{margin-top:18px;font-size:.72rem;color:var(--mute);line-height:1.7;border-top:1px dashed var(--line);padding-top:12px}
.credit{margin-top:14px;text-align:center;font-size:.8rem;letter-spacing:.12em;color:var(--mute)}
.credit a{color:var(--a);text-decoration:none;text-shadow:0 0 8px var(--a)}
.credit a:hover{text-decoration:underline}
.tabs{display:flex;margin-top:22px;border-bottom:1px solid var(--line)}
.tab{flex:1;background:transparent;color:var(--mute);border:1px solid transparent;border-bottom:0;padding:11px 8px;font:inherit;font-size:.85rem;letter-spacing:.14em;cursor:pointer;transition:.2s}
.tab:hover{color:var(--a)}
.tab:disabled{cursor:wait}
.tab[aria-selected=true]{color:var(--a);border-color:var(--line);background:rgba(0,229,255,.07);text-shadow:0 0 10px var(--a);box-shadow:inset 0 2px 0 var(--a)}
[hidden]{display:none!important}
.drop{margin-top:18px;border:1px dashed var(--a);padding:28px 16px;text-align:center;background:rgba(0,229,255,.03);transition:.2s;cursor:pointer;outline:none}
.drop:hover,.drop:focus-visible,.drop.drag{background:rgba(0,229,255,.1);box-shadow:0 0 24px rgba(0,229,255,.25),inset 0 0 24px rgba(0,229,255,.08)}
.drop .big{font-size:1.6rem;color:var(--a);text-shadow:0 0 12px var(--a);letter-spacing:.3em}
.drop .sub{font-size:.78rem;color:var(--mute);margin-top:6px;letter-spacing:.05em}
.finfo{margin-top:14px;display:flex;justify-content:space-between;gap:10px;font-size:.85rem;border:1px solid var(--line);padding:10px 12px;background:rgba(0,0,0,.35)}
.finfo b{color:var(--a);overflow-wrap:anywhere;font-weight:600}
.finfo span{white-space:nowrap;color:var(--mute)}

.prog .track{height:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--a));box-shadow:0 0 12px var(--a);transition:width .25s}
.prog .lab{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mute);margin-top:6px;letter-spacing:.06em}
a.btn{text-decoration:none;display:inline-block}
</style>

<body>
<div class="wrap">
<header>
  <h1>CRYPT//LOCAL<small id="t_sub"></small></h1>

<script>
const I18N = {
  zh:{sub:"本地端到端文字加密終端",badge:"本地運算 · 零上傳 · 連線已封鎖",pw:"密碼短語 / PASSPHRASE",show:"顯示",hide:"隱藏",
    in:"輸入 / 明文或密文",out:"輸出 / 結果",enc:"加密",dec:"解密",clear:"清除",copy:"複製結果",copied:"[OK] 已複製到剪貼簿",
    needpw:"[ERR] 請輸入密碼",needin:"[ERR] 請輸入內容",fail:"[ERR] 失敗:密碼錯誤或密文已損壞",oke:"[OK] 加密完成",okd:"[OK] 解密完成",
    weak:"強度:弱",mid:"強度:中",strong:"強度:強",empty:"建議使用 5 個以上隨機單詞",
    foot:"密碼請透過另一渠道傳給對方。此工具不隱藏元數據,也不提供前向保密;高風險場景請使用更複雜的密碼學工具。",
    tabText:"文字 / TEXT",tabFile:"文件 / FILE",
    drop:"拖放文件到此處,或點擊選擇",dropsub:"單個文件 · 上限 25 MiB · 整檔載入記憶體",
    fenc:"加密文件",fdec:"解密文件",fclear:"清除文件",
    needfile:"[ERR] 請先選擇文件",toobig:"[ERR] 文件超過 25 MiB 上限",
    reading:"讀取文件",deriving:"導出密鑰 (PBKDF2)",encrypting:"加密中",decrypting:"解密中",finishing:"完成",
    fok:"[OK] 文件加密完成,請下載後先測試解密",fdok:"[OK] 驗證通過,文件已解密",
    fbad:"[ERR] 不是有效的 .tcrypt 文件",ffail:"[ERR] 失敗:密碼錯誤或文件已損壞",
    dlEnc:"⬇ 下載加密文件",dlDec:"⬇ 下載原文件",single:"[ERR] 請一次只放一個文件",
    ffoot:"文件模式:原檔名與類型存於加密內容中,輸出固定命名為 encrypted.tcrypt,文件大小仍可推估;只支援本頁格式,不相容 age / GPG。"},
  en:{sub:"LOCAL TEXT ENCRYPTION TERMINAL",badge:"LOCAL COMPUTE · ZERO UPLOAD · NETWORK BLOCKED",pw:"PASSPHRASE",show:"SHOW",hide:"HIDE",
    in:"INPUT / PLAINTEXT OR CIPHERTEXT",out:"OUTPUT / RESULT",enc:"ENCRYPT",dec:"DECRYPT",clear:"CLEAR",copy:"COPY RESULT",copied:"[OK] Copied to clipboard",
    needpw:"[ERR] Enter a passphrase",needin:"[ERR] Enter some input",fail:"[ERR] Failed: wrong passphrase or corrupted ciphertext",oke:"[OK] Encrypted",okd:"[OK] Decrypted",
    weak:"STRENGTH: WEAK",mid:"STRENGTH: MEDIUM",strong:"STRENGTH: STRONG",empty:"Use 5+ random words",
    foot:"Share the passphrase through a separate channel. No metadata protection or forward secrecy; For high-risk use, please use more complex cryptographic tools.",
    tabText:"TEXT",tabFile:"FILE",
    drop:"Drop a file here, or click to select",dropsub:"Single file · 25 MiB max · loaded fully into memory",
    fenc:"ENCRYPT FILE",fdec:"DECRYPT FILE",fclear:"CLEAR FILE",
    needfile:"[ERR] Select a file first",toobig:"[ERR] File exceeds the 25 MiB limit",
    reading:"Reading file",deriving:"Deriving key (PBKDF2)",encrypting:"Encrypting",decrypting:"Decrypting",finishing:"Done",
    fok:"[OK] File encrypted. Download it and test decryption first",fdok:"[OK] Verified. File decrypted",
    fbad:"[ERR] Not a valid .tcrypt file",ffail:"[ERR] Failed: wrong passphrase or corrupted file",
    dlEnc:"⬇ DOWNLOAD ENCRYPTED FILE",dlDec:"⬇ DOWNLOAD ORIGINAL FILE",single:"[ERR] Drop one file at a time",
    ffoot:"File mode: original name and type are stored inside the encrypted payload; output is always named encrypted.tcrypt and file size is still inferable. Only this page's format; not compatible with age / GPG."}
};
let L = navigator.language.startsWith("zh") ? "zh" : "en";
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const ITER = 600000, VER = 1, MAX = 25*1024*1024;
const MAGIC = enc.encode("TCRYPT01"), HEAD = 8+1+16+12;
let selected = null, dlUrl = null, busy = false;

function applyLang(){
  const t = I18N[L];
  document.documentElement.lang = L==="zh" ? "zh-Hant" : "en";
  $("t_sub").textContent=t.sub; $("t_badge").textContent=t.badge; $("t_pw").textContent=t.pw;
  $("t_in").textContent=t.in; $("t_out").textContent=t.out; $("enc").textContent=t.enc;
  $("dec").textContent=t.dec; $("clear").textContent=t.clear; $("copy").textContent=t.copy;
  $("show").textContent = $("pw").type==="password" ? t.show : t.hide;
  $("t_foot").textContent=t.foot; $("lang").textContent = L==="zh" ? "EN" : "中文";
  $("tabText").textContent=t.tabText; $("tabFile").textContent=t.tabFile;
  $("t_drop").textContent=t.drop; $("t_dropsub").textContent=t.dropsub; $("t_ffoot").textContent=t.ffoot;
  $("fenc").textContent=t.fenc; $("fdec").textContent=t.fdec; $("fclear").textContent=t.fclear;
  if(!$("dl").hidden) $("dl").textContent = $("dl").dataset.kind==="enc" ? t.dlEnc : t.dlDec;
  updateStrength();
}

function updateStrength(){
  const p=$("pw").value, t=I18N[L], segs=$("bar").children;
  let pool=0;
  if(/[a-z]/.test(p))pool+=26; if(/[A-Z]/.test(p))pool+=26; if(/\d/.test(p))pool+=10;
  if(/[^A-Za-z0-9]/.test(p))pool+=32;
  const bits = p ? p.length*Math.log2(Math.max(pool,2)) : 0;
  const n = !p?0: bits<35?1: bits<50?2: bits<75?3: bits<100?4:5;
  const col = n<=2?"var(--bad)": n===3?"var(--warn)":"var(--ok)";
  for(let i=0;i<5;i++){segs[i].style.background = i<n ? col : "rgba(255,255,255,.08)"; segs[i].style.boxShadow = i<n ? "0 0 8px "+col : "none";}
  if(!p){$("strength").textContent=t.empty;return;}
  $("strength").textContent=(n<=2?t.weak:n===3?t.mid:t.strong)+" (~"+Math.round(bits)+" bits)";
}

function toB64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function fromB64(s){return Uint8Array.from(atob(s.replace(/\s+/g,"")),c=>c.charCodeAt(0));}
function join(...a){const r=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let o=0;for(const x of a){r.set(x,o);o+=x.length;}return r;}

async function deriveKey(pw,salt,usage){
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,usage);
}
async function encrypt(text,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(text)));
  const out=new Uint8Array(1+16+12+ct.length);
  out[0]=VER; out.set(salt,1); out.set(iv,17); out.set(ct,29);
  return toB64(out);
}
async function decrypt(b64,pw){
  const d=fromB64(b64);
  if(d[0]!==VER) throw new Error("version");
  const key=await deriveKey(pw,d.slice(1,17),["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(17,29)},key,d.slice(29));
  return dec.decode(pt);
}

function setMsg(text,cls){const m=$("msg");m.textContent=text;m.className=cls||"";}
function setFMsg(text,cls){const m=$("fmsg");m.textContent=text;m.className=cls||"";}
const ALL_BTNS=["enc","dec","clear","copy","fenc","fdec","fclear","tabText","tabFile"];
function lock(on){busy=on;ALL_BTNS.forEach(id=>$(id).disabled=on);}

async function run(fn,okKey,btn){
  const t=I18N[L]; setMsg("");
  if(!$("pw").value) return setMsg(t.needpw,"err");
  if(!$("input").value.trim()) return setMsg(t.needin,"err");
  lock(true); btn.classList.add("busy");
  await new Promise(r=>setTimeout(r,30));
  try{ $("output").value=await fn($("input").value,$("pw").value); setMsg(t[okKey],"good"); }
  catch(e){ $("output").value=""; setMsg(t.fail,"err"); }
  lock(false); btn.classList.remove("busy");
}

function setTab(name){
  if(busy) return;
  $("paneText").hidden = name!=="text"; $("paneFile").hidden = name!=="file";
  $("tabText").setAttribute("aria-selected",String(name==="text"));
  $("tabFile").setAttribute("aria-selected",String(name==="file"));
}

function fmtSize(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KiB":(n/1048576).toFixed(2)+" MiB";}
function setProg(pct,label){$("prog").hidden=false;$("fill").style.width=pct+"%";$("ppct").textContent=Math.round(pct)+"%";$("plabel").textContent=label;}
function clearDl(){if(dlUrl){URL.revokeObjectURL(dlUrl);dlUrl=null;}$("dl").hidden=true;$("dl").removeAttribute("href");}
function pick(f){
  if(busy) return;
  clearDl(); setFMsg(""); $("prog").hidden=true;
  selected=f||null;
  $("finfo").hidden=!selected;
  if(selected){$("fname").textContent=selected.name;$("fsize").textContent=fmtSize(selected.size);}
}
function readFile(f,onPct){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onprogress=e=>{if(e.lengthComputable)onPct(e.loaded/e.total);};
    r.onload=()=>res(new Uint8Array(r.result));
    r.onerror=()=>rej(new Error("read"));
    r.readAsArrayBuffer(f);
  });
}
function offer(bytes,name,kind){
  clearDl();
  dlUrl=URL.createObjectURL(new Blob([bytes],{type:"application/octet-stream"}));
  const a=$("dl"); a.href=dlUrl; a.download=name; a.dataset.kind=kind; a.hidden=false;
  a.textContent = kind==="enc" ? I18N[L].dlEnc : I18N[L].dlDec;
}
function safeName(n){
  const s=String(n).split(/[\\/]/).pop().replace(/[\u0000-\u001f\u007f<>:"|?*]/g,"_").slice(0,180);
  return (!s||s==="."||s==="..") ? "decrypted-file" : s;
}

async function fileRun(kind,btn){
  const t=I18N[L]; setFMsg(""); clearDl();
  if(!$("pw").value) return setFMsg(t.needpw,"err");
  if(!selected) return setFMsg(t.needfile,"err");
  if(kind==="enc" && selected.size>MAX) return setFMsg(t.toobig,"err");
  if(kind==="dec" && selected.size>MAX+HEAD+16+4+8192) return setFMsg(t.toobig,"err");
  lock(true); btn.classList.add("busy");
  try{
    setProg(0,t.reading);
    const data=await readFile(selected,p=>setProg(p*35,t.reading));
    setProg(40,t.deriving);
    await new Promise(r=>setTimeout(r,40));
    if(kind==="enc"){
      const meta=enc.encode(JSON.stringify({name:selected.name,type:selected.type||"application/octet-stream"}));
      const len=new Uint8Array(4); new DataView(len.buffer).setUint32(0,meta.length);
      const payload=join(len,meta,data);
      const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
      const header=join(MAGIC,new Uint8Array([VER]),salt,iv);
      const key=await deriveKey($("pw").value,salt,["encrypt"]);
      setProg(70,t.encrypting);
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:header,tagLength:128},key,payload));
      setProg(100,t.finishing);
      offer(join(header,ct),"encrypted.tcrypt","enc");
      setFMsg(t.fok,"good");
    }else{
      if(data.length<HEAD+16+4 || !MAGIC.every((v,i)=>data[i]===v) || data[8]!==VER) throw new Error("fmt");
      const header=data.slice(0,HEAD), salt=data.slice(9,25), iv=data.slice(25,37);
      const key=await deriveKey($("pw").value,salt,["decrypt"]);
      setProg(70,t.decrypting);
      const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv,additionalData:header,tagLength:128},key,data.slice(HEAD));
      const bytes=new Uint8Array(raw);
      const n=new DataView(raw).getUint32(0);
      if(n>8192||4+n>bytes.length) throw new Error("fmt");
      const meta=JSON.parse(dec.decode(bytes.slice(4,4+n)));
      setProg(100,t.finishing);
      offer(bytes.slice(4+n),safeName(meta.name),"dec");
      setFMsg(t.fdok,"good");
    }
  }catch(e){
    $("prog").hidden=true;
    setFMsg(e.message==="fmt"?t.fbad:t.ffail,"err");
  }
  lock(false); btn.classList.remove("busy");
}

$("enc").onclick=()=>run(encrypt,"oke",$("enc"));
$("dec").onclick=()=>run(decrypt,"okd",$("dec"));
$("clear").onclick=()=>{$("pw").value=$("input").value=$("output").value="";setMsg("");updateStrength();};
$("pw").oninput=updateStrength;
$("show").onclick=()=>{$("pw").type=$("pw").type==="password"?"text":"password";applyLang();};
$("lang").onclick=()=>{L=L==="zh"?"en":"zh";applyLang();};
$("theme").onclick=()=>document.documentElement.classList.toggle("green");
$("copy").onclick=async()=>{
  if(!$("output").value)return;
  try{await navigator.clipboard.writeText($("output").value);}
  catch{$("output").select();document.execCommand("copy");}
  setMsg(I18N[L].copied,"good");
};
$("tabText").onclick=()=>setTab("text");
$("tabFile").onclick=()=>setTab("file");
$("drop").onclick=()=>{if(!busy)$("fileIn").click();};
$("drop").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&!busy){e.preventDefault();$("fileIn").click();}};
$("fileIn").onchange=()=>{pick($("fileIn").files[0]);};
["dragenter","dragover"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();if(!busy)$("drop").classList.add("drag");}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.remove("drag");}));
$("drop").addEventListener("drop",e=>{
  if(busy)return;
  const fs=e.dataTransfer.files;
  if(fs.length!==1){setFMsg(I18N[L].single,"err");return;}
  pick(fs[0]);
});
["dragover","drop"].forEach(ev=>window.addEventListener(ev,e=>e.preventDefault()));
$("fenc").onclick=()=>fileRun("enc",$("fenc"));
$("fdec").onclick=()=>fileRun("dec",$("fdec"));
$("fclear").onclick=()=>{if(busy)return;clearDl();selected=null;$("fileIn").value="";$("finfo").hidden=true;$("prog").hidden=true;setFMsg("");};
window.addEventListener("pagehide",clearDl);
applyLang();
</script>
</body>
